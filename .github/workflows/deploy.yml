name: Deploy

# Builds the site, prints the resume to cv.pdf from that same build and ships
# the result to Vercel as a prebuilt deployment. Production on main, a preview
# deployment for pull requests and manual runs on any other branch. The weekly run refreshes
# build-time data (GitHub stars, Zdroják articles, years of experience).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # --prod only from main; anything else becomes a preview deployment
      VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VERCEL_PROD: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        run: pnpm exec vercel build ${VERCEL_PROD:+--prod} --token="$VERCEL_TOKEN"
        env:
          # repo cards on /projects/; don't rely on vercel pull, sensitive vars come back empty
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No --with-deps: it runs apt-get on every run and the Ubuntu mirror is at times
      # minutes slow. ubuntu-latest ships Google Chrome, so Chromium's shared libraries are
      # already there; the apt step only added CJK fonts, xvfb and X fonts the print never uses.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Print resume to cv.pdf
        run: node bin/cv.mjs .vercel/output/static

      - name: Deploy
        run: |
          url=$(pnpm exec vercel deploy --prebuilt ${VERCEL_PROD:+--prod} --token="$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
